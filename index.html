<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batts Marketing | Creative Worlds</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MAIN CONTAINER -->
    <div class="container">
        
        <!-- HOME SECTION -->
        <div id="home-section">
            <!-- LOGO SECTION -->
            <div class="logo-section">
                <!-- YOUR LOGO -->
                <img src="images/batts-logo.png" alt="Batts Marketing Logo" class="main-logo" id="batts-logo">
                
                <!-- Company Name Banner -->
                <h1 class="company-name">Batts Marketing</h1>
            </div>
            
            <!-- BUTTONS SECTION -->
            <div class="buttons-section" id="buttons-section">
                <button class="world-btn writing-btn" onclick="enterWorld('writing')">
                    <i class="fas fa-book-open btn-icon"></i>
                    <span class="btn-text">Writing & Books</span>
                </button>
                
                <button class="world-btn music-btn" onclick="enterWorld('music')">
                    <i class="fas fa-music btn-icon"></i>
                    <span class="btn-text">Music & Film</span>
                </button>
                
                <button class="world-btn art-btn" onclick="enterWorld('art')">
                    <i class="fas fa-palette btn-icon"></i>
                    <span class="btn-text">Art & Design</span>
                </button>
            </div>
        </div>
        
        <!-- VIDEO PLAYER -->
        <div class="video-player" id="video-player">
            <video id="world-video" controls>
                Your browser does not support the video tag.
            </video>
            <button class="skip-btn" onclick="skipVideo()">Skip Intro <i class="fas fa-forward"></i></button>
        </div>
        
        <!-- WORLD PAGES -->
        <div class="world-page" id="writing-page">
            <!-- Content loaded by JavaScript -->
        </div>
        
        <div class="world-page" id="music-page">
            <h2>Music & Film Page</h2>
            <p>This is a placeholder for the Music & Film content.</p>
            <button class="back-home-btn" onclick="goBackHome()">Back Home</button>
        </div>
        
        <div class="world-page" id="art-page">
            <h2>Art & Design Page</h2>
            <p>This is a placeholder for the Art & Design content.</p>
            <button class="back-home-btn" onclick="goBackHome()">Back Home</button>
        </div>
        
    </div>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
